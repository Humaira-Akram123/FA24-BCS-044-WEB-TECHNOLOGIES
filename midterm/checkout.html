<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Aven Perfumes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="top-bar"></div>

  <header class="checkout-header container-xl d-flex align-items-center justify-content-between py-3">
    <a href="index.html"><img src="images/logo.png" alt="Aven Luxury Perfumes" height="64"></a>
    <a href="index.html" class="checkout-back">&larr; Back to shop</a>
  </header>

  <main class="container-xl checkout">
    <h1 class="text-center mb-4">Checkout</h1>

    <form class="checkout-form" action="#" method="get">

      <fieldset>
        <legend>Contact</legend>

        <div class="field">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" required minlength="3" autocomplete="name" placeholder="Ayesha Khan">
          <span class="msg">Please enter your full name (at least 3 characters).</span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
          <span class="msg">Please enter a valid email address.</span>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" required pattern="03[0-9]{2}-[0-9]{7}" autocomplete="tel" placeholder="0300-1234567" title="Format: 03XX-XXXXXXX">
          <span class="msg">Phone must look like 03XX-XXXXXXX.</span>
        </div>
      </fieldset>

      <fieldset>
        <legend>Delivery</legend>

        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" required minlength="8" autocomplete="street-address" placeholder="House 12, Street 4, Model Town">
          <span class="msg">Please enter your full street address.</span>
        </div>

        <div class="field">
          <label for="city">City</label>
          <select id="city" name="city" required>
            <option value="">Choose a city…</option>
            <option>Lahore</option>
            <option>Karachi</option>
            <option>Islamabad</option>
            <option>Rawalpindi</option>
            <option>Faisalabad</option>
          </select>
          <span class="msg">Please choose a city.</span>
        </div>

        <div class="field">
          <label for="date">Delivery date</label>
          <!-- min = exam date (2026-10-29); max = exam date + N days (N = 44 -> 2026-12-12) -->
          <input type="date" id="date" name="date" required min="2026-10-29" max="2026-12-12">
          <span class="msg">Pick a date between 29 Oct 2026 and 12 Dec 2026.</span>
        </div>
      </fieldset>

      <button type="submit" class="checkout-submit">Place order</button>
    </form>
  </main>
</body>
</html>
