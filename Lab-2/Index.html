<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2 – Responsive Navbar and Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar: collapses into a hamburger below 768px (navbar-expand-md) -->
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom sticky-top">
    <div class="container">

      <!-- Logo (left) -->
      <a class="navbar-brand nav-side fw-bold" href="#">ShopLogo</a>

      <!-- Cart + hamburger (right). order-md-last keeps cart at the far right on desktop -->
      <div class="nav-side nav-end d-flex align-items-center justify-content-end gap-2 order-md-last">
        <a class="btn btn-outline-dark position-relative" href="#" aria-label="Cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/>
          </svg>
          <span class="badge text-bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">3</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Links (center) -->
      <div class="collapse navbar-collapse justify-content-center" id="mainNav">
        <ul class="navbar-nav text-center">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Product grid: 1 col phone, 2 col tablet (md), 4 col desktop (lg) -->
  <main class="container py-4">
    <h1 class="h3 mb-4">Products</h1>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="productGrid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Generate 8 placeholder cards so the HTML stays short
    const colors = ['#cfe2ff', '#d1e7dd', '#fff3cd', '#f8d7da', '#e2d9f3', '#d2f4ea', '#ffe5d0', '#e9ecef'];
    const grid = document.getElementById('productGrid');

    colors.forEach((color, i) => {
      grid.insertAdjacentHTML('beforeend', `
        <div class="col">
          <div class="card h-100">
            <div class="ratio ratio-4x3 rounded-top" style="background:${color}" role="img" aria-label="Product image placeholder"></div>
            <div class="card-body">
              <h2 class="h6 card-title">Product ${i + 1}</h2>
              <p class="card-text text-body-secondary small">Short placeholder description for this product.</p>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center bg-transparent">
              <span class="fw-semibold">$${(19 + i * 5).toFixed(2)}</span>
              <button class="btn btn-dark btn-sm">Add to cart</button>
            </div>
          </div>
        </div>`);
    });
  </script>
</body>
</html>
